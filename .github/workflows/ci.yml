name: CI

# Se ejecuta en cada pull request y en cada push a main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (sintaxis y pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://compralatino:pruebas@localhost:5432/compralatino
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: compralatino
          POSTGRES_PASSWORD: pruebas
          POSTGRES_DB: compralatino
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compralatino -d compralatino"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc   # Node.js 22 LTS, la misma version del equipo
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Verificar la sintaxis de todos los archivos JavaScript
        run: find src db -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Cargar el esquema de la base de datos (Fase 2 + migraciones)
        run: for f in ../deploy/db-init/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Pruebas automatizadas con cobertura minima (unitarias y de API)
        run: npm run test:coverage
      - name: Cargar y conciliar el almacén dimensional dos veces
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE compralatino_bi'
          export DATABASE_URL="${DATABASE_URL%/*}/compralatino_bi"
          for f in ../deploy/db-init/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done
          npm run seed
          npm run catalogo:demo
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../bi/F1_ddl_dw.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../bi/F2_etl.sql
          for i in 1 2; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../bi/ejecutar_etl.sql
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../bi/verificar_etl.sql
          done

  frontend:
    name: Frontend (construccion)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build

  docker:
    name: Imagenes Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t compralatino-backend .
      - run: docker build -t compralatino-frontend ./frontend
