# CompraLatino — despliegue con Docker Compose (Fase 5)
# Uso:  cp .env.example .env  →  editar secretos  →  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: compralatino
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      POSTGRES_DB: compralatino
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Se ejecutan SOLO la primera vez (volumen vacío), en orden alfabético:
      # schema.sql de Fase 2 + las tres migraciones aditivas de Fase 3
      - ./deploy/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compralatino -d compralatino"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Sin "ports": la base de datos NO se expone fuera de la red de Docker

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://compralatino:${DB_PASSWORD}@db:5432/compralatino
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_EXPIRES_IN: 900
      JWT_REFRESH_EXPIRES_IN: 1209600
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Define WEBHOOK_SECRET en .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      PORT: 3000
      HOST: 0.0.0.0
      YAUCTIONS_LATENCY_MS_MIN: 150
      YAUCTIONS_LATENCY_MS_MAX: 900
      YAUCTIONS_FAILURE_RATE: ${YAUCTIONS_FAILURE_RATE:-0}
      YAUCTIONS_BREAKER_THRESHOLD: 5
      YAUCTIONS_BREAKER_COOLDOWN_MS: 30000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/salud/listo').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 5
    # Sin "ports": solo nginx (web) lo alcanza

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"

volumes:
  pgdata:
